{% extends "base.html" %}

{% block content %}
    <!-- SUB-MENU DASHBOARD (TABS) -->
    <div class="bg-body p-2 rounded-4 shadow-sm mb-4 border border-secondary border-opacity-25 sticky-top z-3" style="top: 85px;">
        <ul class="nav nav-pills nav-fill gap-2">
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/dashboard/evaluasi' %}active bg-navy text-white shadow-sm fw-bold{% else %}text-body fw-medium{% endif %} rounded-3" href="/dashboard/evaluasi">
                    <i class="bi bi-clipboard-data me-2"></i> 1. Control Panel Evaluasi
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/dashboard' %}active bg-navy text-white shadow-sm fw-bold{% else %}text-body fw-medium{% endif %} rounded-3" href="/dashboard">
                    <i class="bi bi-graph-up-arrow me-2"></i> 2. Hasil Evaluasi BM25
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/dashboard/perbandingan' %}active bg-navy text-white shadow-sm fw-bold{% else %}text-body fw-medium{% endif %} rounded-3" href="/dashboard/perbandingan">
                    <i class="bi bi-bar-chart-split me-2"></i> 3. Komparasi Algoritma
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/dashboard/tuning' %}active bg-navy text-white shadow-sm fw-bold{% else %}text-body fw-medium{% endif %} rounded-3" href="/dashboard/tuning">
                    <i class="bi bi-sliders2 me-2"></i> 4. Tuning Parameter
                </a>
            </li>
        </ul>
    </div>

    {% block dashboard_content %}{% endblock %}
{% endblock %}
