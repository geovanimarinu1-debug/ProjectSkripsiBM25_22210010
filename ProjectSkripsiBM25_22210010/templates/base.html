<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard Evaluasi Kamus Bahasa Manado{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    {% block extra_head %}{% endblock %}
    <style>{% block extra_css %}{% endblock %}</style>
    <script>
        // Terapkan tema SEBELUM body dirender (anti flash putih)
        document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');
    </script>
</head>
<body class="py-4">
<div class="desktop-container">

    <!-- NAVBAR UTAMA -->
    <div class="bg-body p-3 rounded-4 shadow-sm mb-4 d-flex justify-content-between align-items-center border border-secondary border-opacity-25">
        <h5 class="mb-0 text-navy fw-bold ms-2"><i class="bi bi-box-seam me-2"></i>Sistem Evaluasi Kamus Bahasa Manado</h5>
        <div class="d-flex align-items-center flex-wrap gap-2">
            <ul class="nav nav-pills me-3 mb-0">
                <li class="nav-item"><a class="nav-link text-body fw-semibold px-3" href="/"><i class="bi bi-search me-1"></i> Pencarian</a></li>
                <li class="nav-item"><a class="nav-link text-body fw-semibold px-3" href="/kelola"><i class="bi bi-database me-1"></i> Dataset</a></li>
                <li class="nav-item"><a class="nav-link text-body fw-semibold px-3" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i> Dashboard Analitik</a></li>
            </ul>
            <button class="btn btn-outline-secondary rounded-circle shadow-sm" id="theme-toggle" style="width: 45px; height: 45px;">
                <i class="bi bi-moon-stars-fill fs-5" id="theme-icon"></i>
            </button>
        </div>
    </div>

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
